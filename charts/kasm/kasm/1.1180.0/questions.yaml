questions:
- variable: publicAddr
  label: publicAddr
  description: "Set the access URL to be used for the Kasm deployment."
  type: string
  required: true
- variable: ingress.enabled
  label: ingress_enabled
  description: "Set the enabled value to `true` to use a pre-defined Ingress service to expose Kasm."
  type: string
  default: false
  required: true
- variable: certificate.secretName
  label: certificate_secretName
  description: "Set the secret name where the certificate is stored. Ensure that the secret has been created beforehand."
  type: string
  required: true
- variable: proxyService.type
  label: proxyService_type
  description: "If ingress.enabled set to `true` service.type MUST be set to `ClusterIP`."
  type: string
  default: LoadBalancer
  required: true